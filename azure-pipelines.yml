  - stage: terraformplan
    displayName: terraform plan
   
    jobs:
      - job: 
        displayName: terraform Plan
        steps:
          - checkout: self
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'firstServiceConnection'
              backendAzureRmStorageAccountName: 'firstpipeline99'
