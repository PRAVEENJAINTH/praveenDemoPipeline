# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main
pool:
  name: 'PraveenPool'
stages:
  - stage: terraforminit
    displayName: terraform init
    jobs:
      - job: 
        displayName: terraform init
        steps:
        - checkout: self

          
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'firstServiceConnection'
            backendAzureRmStorageAccountName: 'firstpipeline99'
            backendAzureRmContainerName: 'firstpipelinecontainer'
            backendAzureRmKey: 'dev_terraform'


  - stage: terraformvalidate
    displayName: terraform validate
    dependsOn: terraforminit
    jobs:
      - job: 
        displayName: terraform Validate
        steps:
          - checkout: self

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'firstServiceConnection'
              backendAzureRmStorageAccountName: 'firstpipeline99'
              backendAzureRmContainerName: 'firstpipelinecontainer'
              backendAzureRmKey: 'dev_terraform'
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'validate'
              environmentAzureRmUseIdTokenGeneration: true

  - stage: tflint
    displayName: tfsec scan
    dependsOn: terraforminit
    jobs:
      - job: 
        displayName: tfsec Scan
        steps:
          - checkout: self 
          - script: 
          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: |
                # 1. Download TFLint for Windows
                $zipUrl = "https://github.com/terraform-linters/tflint/releases/latest/download/tflint_windows_amd64.zip"
                $checksumUrl = "https://github.com/terraform-linters/tflint/releases/latest/download/checksums.txt"
                
                Invoke-WebRequest -Uri $zipUrl -OutFile "tflint_windows_amd64.zip"
                Invoke-WebRequest -Uri $checksumUrl -OutFile "checksums.txt"
          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: |
                # 2. Verify GitHub attestation
                gh attestation verify checksums.txt -R terraform-linters/tflint
                if ($LASTEXITCODE -ne 0) {
                    throw "GitHub attestation verification failed"
                }
          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: |
                # 3. Verify SHA256 checksum
                $checksumLine = Get-Content "checksums.txt" |
                    Where-Object { $_ -match 'tflint_windows_amd64\.zip' } |
                    Select-Object -First 1
                
                if (-not $checksumLine) {
                    throw "Windows ZIP checksum not found in checksums.txt"
                }
                
                $expectedHash = ($checksumLine.Trim() -split '\s+')[0].ToLower()
                $actualHash = (Get-FileHash "tflint_windows_amd64.zip" -Algorithm SHA256).Hash.ToLower()
                
                if ($actualHash -ne $expectedHash) {
                    throw "SHA256 checksum verification failed"
                }
                
                Write-Host "Checksum verified successfully"
          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: |
                # 4. Extract ZIP
                Expand-Archive -Path "tflint_windows_amd64.zip" -DestinationPath "." -Force
          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: |
                # 5. Install TFLint in a directory accessible to the current user
                $installDir = "$env:USERPROFILE\bin"
                New-Item -ItemType Directory -Path $installDir -Force | Out-Null
                
                Copy-Item ".\tflint.exe" "$installDir\tflint.exe" -Force
          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: |
                # 6. Add to PATH for the current PowerShell session
                $env:Path = "$installDir;$env:Path"
                
          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: |
                # 7. Verify installation
                tflint --version
          



  - stage: terraformplan
    displayName: terraform plan
   
    jobs:
      - job: 
        displayName: terraform Plan
        steps:
          - checkout: self
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'firstServiceConnection'
              backendAzureRmStorageAccountName: 'firstpipeline99'
              backendAzureRmContainerName: 'firstpipelinecontainer'
              backendAzureRmKey: 'dev_terraform'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: 'firstServiceConnection'
              environmentAzureRmOverrideSubscriptionID: 'aa688742-37f0-42a5-b2e3-0134d87fbc3e'
  - stage: terraformApply
    displayName: terraform Apply
    jobs:
      - job: 
        displayName: terraform Apply
        steps:
          - checkout: self
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'firstServiceConnection'
              backendAzureRmStorageAccountName: 'firstpipeline99'
              backendAzureRmContainerName: 'firstpipelinecontainer'
              backendAzureRmKey: 'dev_terraform'
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'apply'
              environmentServiceNameAzureRM: 'firstServiceConnection'