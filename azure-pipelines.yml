# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main
pool:
  name: 'PraveenPool'
stages:
  - stage: terraforminit
    displayName: terraform init
    jobs:
      - job: 
        displayName: terraform init
        steps:
        - checkout: self

          
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'firstServiceConnection'
            backendAzureRmStorageAccountName: 'firstpipeline99'
            backendAzureRmContainerName: 'firstpipelinecontainer'
            backendAzureRmKey: 'dev_terraform'


  - stage: terraformvalidate
    displayName: terraform validate
    dependsOn: terraforminit
    jobs:
      - job: 
        displayName: terraform Validate
        steps:
          - checkout: self

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'firstServiceConnection'
              backendAzureRmStorageAccountName: 'firstpipeline99'
              backendAzureRmContainerName: 'firstpipelinecontainer'
              backendAzureRmKey: 'dev_terraform'
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'validate'
              environmentAzureRmUseIdTokenGeneration: true

  - stage: tfsec
    displayName: tfsec scan
    dependsOn: terraforminit
    jobs:
      - job: 
        displayName: tfsec Scan
        steps:
          - checkout: self 
          - script: |
              winget install -e --id TerraformLinters.tflint
              winget install --exact --id terraform-linters.tflint
              tfsec .
              tflint --version
              tflint --init
              tflint          




  - stage: terraformplan
    displayName: terraform plan
   
    jobs:
      - job: 
        displayName: terraform Plan
        steps:
          - checkout: self
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'firstServiceConnection'
              backendAzureRmStorageAccountName: 'firstpipeline99'
              backendAzureRmContainerName: 'firstpipelinecontainer'
              backendAzureRmKey: 'dev_terraform'

          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: 'firstServiceConnection'
              environmentAzureRmOverrideSubscriptionID: 'aa688742-37f0-42a5-b2e3-0134d87fbc3e'
  - stage: terraformApply
    displayName: terraform Apply
    jobs:
      - job: 
        displayName: terraform Apply
        steps:
          - checkout: self
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'firstServiceConnection'
              backendAzureRmStorageAccountName: 'firstpipeline99'
              backendAzureRmContainerName: 'firstpipelinecontainer'
              backendAzureRmKey: 'dev_terraform'
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'apply'
              environmentServiceNameAzureRM: 'firstServiceConnection'